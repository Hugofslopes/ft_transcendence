<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P O N G</title>
    <!-- CSS links are not processed when loaded via SPA fetch - they should be in index.html -->
</head>
<body class="bg-black">
    <div class="w-screen h-screen bg-cover bg-center bg-no-repeat flex items-center justify-center" style="background-image: url('/assets/background.png');">
        <!-- Nested circles with gaps - 11 circles total -->
        <div class="relative flex items-center justify-center">
            <!-- Circle 1 - Outermost -->
            <div class="absolute circle-1 border-vw-2 border-white rounded-full"></div>
            <!-- Circle 2 -->
            <div class="absolute circle-2 border-vw-3 border-white rounded-full"></div>
            <!-- Circle 3 -->
            <div class="absolute circle-3 border-vw-2 border-white rounded-full"></div>
            <!-- Circle 4 -->
            <div class="absolute circle-4 border-vw-3 border-white rounded-full dotted-border rotate-outter-slow"></div>
            <!-- Circle 5 -->
            <div class="absolute circle-5 border-vw-2 border-white rounded-full"></div>
            <!-- Circle 6 -->
            <div class="absolute circle-6 border-vw-4 border-white rounded-full"></div>
            
            <!-- Auth button positioned to the left of circle 6 -->
            <button id="auth-btn" class="auth-button">Login</button>
            <button id="play-btn" class="play-button">Play</button>
            <button id="profile-btn" class="profile-button">Profile</button>
            <button id="settings-btn" class="settings-button">Settings</button>
            <button id="logout-btn" class="logout-button">Logout</button>
            <!-- Circle 7 -->
            <div class="absolute circle-7 border-vw-2 border-white rounded-full"></div>
            <!-- Circle 8 -->
            <div class="absolute circle-8 border-vw-5 border-white rounded-full"></div>
            <!-- Circle 9 -->
            <div class="absolute circle-9 border-vw-2 border-white rounded-full"></div>
            <!-- Circle 10 -->  
            <div class="absolute circle-10 border-vw-2 border-white rounded-full"></div>
            <!-- Orbiting circle circumference -->
            <div class="absolute border-2 border-white orbiting-circumference1 rounded-full orbit-circle-10"></div>
            <!-- Orbiting circle that follows circle-10 path -->
            <div class="absolute orbiting-dot1 bg-white rounded-full orbit-circle-10"></div>
            <!-- Circle 11 - Innermost (dotted and rotating) -->
            <div class="absolute circle-11 border-vw-3 border-white rounded-full dotted-border rotate-inner-slow"></div>
            <!-- Center content -->
            <h1 class="text-white font-montserrat title relative z-10">PONG</h1>
        </div>
    </div>

    <script type="module" src="./pong.js"></script>
</body>
</html>
